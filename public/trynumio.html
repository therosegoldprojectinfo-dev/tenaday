<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Try Numio – Free Trial</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800;900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
  :root {
    --purple: #7c3aed;
    --purple-dark: #5b21b6;
    --purple-light: #ede9fe;
    --pink: #ff2d78;
    --pink-dark: #c4005a;
    --gold: #fbbf24;
    --ink: #1f2937;
    --muted: #9ca3af;
    --bg: #ffffff;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; margin: 0; padding: 0; }
  html, body { height: 100%; background: #f3f4f6; font-family: 'Nunito', sans-serif; }
  body { overflow: hidden; }

  .font-display { font-family: 'Baloo 2', sans-serif; }
  .font-body { font-family: 'Nunito', sans-serif; }

  #app { height: 100dvh; display: flex; position: relative; }

  /* ── SIDEBAR desktop ── */
  .sidebar {
    display: none;
    position: fixed; top: 0; bottom: 0; left: 0;
    width: 224px; background: white;
    border-right: 1px solid #f3f4f6;
    flex-direction: column; z-index: 40;
  }
  @media (min-width: 768px) { .sidebar { display: flex; } }

  .sidebar-logo { padding: 20px 16px 8px; margin-bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
  .sidebar-logo img { height: 50px; width: auto; object-fit: contain; }
  .streak-badge { display: flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; background: #ede9fe; }
  .streak-badge img { width: 16px; height: 16px; object-fit: contain; }
  .streak-badge span { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 12px; color: #7c3aed; }

  .nav-items { display: flex; flex-direction: column; gap: 4px; padding: 0 12px; flex: 1; }
  .nav-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px; border-radius: 16px;
    font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px;
    color: var(--muted); background: none; border: none; cursor: pointer;
    text-align: left; width: 100%; transition: background 0.15s;
  }
  .nav-item:hover { background: #f9fafb; }
  .nav-item.active { background: #f5f3ff; color: var(--purple); }
  .nav-item-icon { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .nav-item-icon img { width: 100%; height: 100%; object-fit: contain; }

  .sidebar-streak {
    margin: auto 8px 16px;
    display: flex; align-items: center; gap: 12px;
    background: #f5f3ff; border-radius: 16px; padding: 12px;
  }
  .sidebar-streak img { width: 40px; height: 40px; object-fit: contain; }

  /* ── BOTTOM NAV mobile ── */
  .bottom-nav {
    display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 40;
    background: white; border-top: 1px solid #f3f4f6;
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (min-width: 768px) { .bottom-nav { display: none; } }
  .bottom-nav-item {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 12px 0; background: none; border: none; cursor: pointer;
  }
  .bottom-nav-icon {
    width: 56px; height: 40px; display: flex; align-items: center; justify-content: center;
    border-radius: 16px; transition: background 0.15s;
  }
  .bottom-nav-icon.active { background: #ede9fe; }
  .bottom-nav-icon img { width: 36px; height: 36px; object-fit: contain; }

  /* ── MAIN CONTENT ── */
  .main {
    flex: 1; height: 100dvh; overflow: hidden;
    padding-bottom: calc(64px + env(safe-area-inset-bottom, 0px));
  }
  @media (min-width: 768px) { .main { margin-left: 224px; padding-bottom: 0; } }

  .screen { height: 100%; overflow-y: auto; background: white; }

  /* ── CHAPTERS SCREEN ── */
  .chapters-inner { max-width: 672px; margin: 0 auto; padding: 48px 20px 40px; }

  .streak-row { margin-bottom: 24px; }
  .streak-row-headline { margin-bottom: 16px; }
  .streak-row-headline h2 { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 24px; color: var(--ink); }
  .streak-row-headline p { font-family: 'Nunito', sans-serif; font-size: 14px; color: var(--muted); margin-top: 2px; }
  .streak-cards { display: flex; gap: 12px; }
  .streak-card {
    display: flex; align-items: center; gap: 8px;
    border-radius: 16px; padding: 12px 16px; flex: 1;
    background: #f9fafb; box-shadow: 0 2px 12px rgba(0,0,0,0.05);
    border: none; cursor: pointer; text-align: left; transition: transform 0.15s;
  }
  .streak-card:active { transform: scale(0.95); }
  .streak-card img { width: 40px; height: 40px; object-fit: contain; flex-shrink: 0; }
  .streak-num { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 24px; line-height: 1; }
  .streak-label { font-family: 'Nunito', sans-serif; font-size: 12px; color: var(--muted); }

  .leaderboard-link { display: flex; align-items: center; gap: 6px; margin-bottom: 16px; background: none; border: none; cursor: pointer; padding: 0; }
  .leaderboard-link span { font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: var(--purple); }

  .chapters-title { margin-bottom: 16px; }
  .chapters-title h1 { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 24px; color: var(--ink); }
  .chapters-title p { font-family: 'Nunito', sans-serif; font-size: 14px; color: var(--muted); margin-top: 2px; }

  .chapters-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .chapter-card {
    border-radius: 24px; background: white; overflow: hidden;
    box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    border: none; cursor: pointer; text-align: left; transition: transform 0.15s;
    width: 100%;
  }
  .chapter-card:active { transform: scale(0.95); }
  .chapter-card-top { display: flex; align-items: center; justify-content: center; height: 110px; border-radius: 24px 24px 0 0; }
  .chapter-card-emoji { font-size: 56px; }
  .chapter-card-body { padding: 12px 16px; }
  .chapter-card-name { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 16px; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chapter-card-sub { font-family: 'Nunito', sans-serif; font-size: 12px; color: var(--muted); margin-top: 2px; }

  .add-chapter-btn {
    width: 100%; padding: 16px; border-radius: 16px; margin-top: 16px;
    border: 2px dashed #c4b5fd; color: var(--purple); background: white;
    font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 16px;
    cursor: pointer; transition: transform 0.15s;
  }
  .add-chapter-btn:active { transform: scale(0.98); }

  .chapters-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding-top: 40px; gap: 24px; text-align: center; padding-left: 16px; padding-right: 16px; }
  .chapters-empty img { width: 128px; height: auto; animation: float 3s ease-in-out infinite; }
  .chapters-empty h2 { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 24px; color: var(--ink); }
  .chapters-empty p { font-family: 'Nunito', sans-serif; font-size: 16px; color: var(--muted); margin-top: 8px; }
  .btn-purple { background: var(--purple); box-shadow: 0 4px 0 var(--purple-dark); color: white; border: none; border-radius: 16px; padding: 20px; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 18px; cursor: pointer; width: 100%; max-width: 320px; transition: transform 0.15s; }
  .btn-purple:active { transform: scale(0.97); }

  /* ── MODAL ── */
  .modal-overlay {
    position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,0.4);
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .modal-sheet {
    width: 100%; max-width: 480px; background: white;
    border-radius: 24px; max-height: 90dvh; display: flex; flex-direction: column;
  }
  .modal-handle { flex-shrink: 0; padding: 12px 0 4px; display: flex; justify-content: center; }
  .modal-handle div { width: 40px; height: 4px; border-radius: 999px; background: #e5e7eb; }
  .modal-body { flex: 1; overflow-y: auto; padding: 0 20px 32px; display: flex; flex-direction: column; gap: 20px; }
  .modal-title { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 24px; color: var(--ink); text-align: center; padding-top: 8px; }
  .form-label { font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; display: block; margin-bottom: 8px; }
  .form-input {
    width: 100%; border-radius: 16px; padding: 12px 16px;
    font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 18px; color: var(--ink);
    border: 2px solid #e5e7eb; background: #fafafa; outline: none; transition: border-color 0.15s;
    direction: ltr; unicode-bidi: isolate; text-align: left;
  }
  .form-input:focus { border-color: var(--purple); }
  .emoji-grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
  @media (min-width: 480px) { .emoji-grid { grid-template-columns: repeat(8, 1fr); } }
  .emoji-btn {
    height: 44px; border-radius: 12px; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #f3f4f6; background: #f9fafb; cursor: pointer; transition: all 0.1s;
  }
  .emoji-btn.selected { border-color: var(--purple); background: #f5f3ff; }
  .chapter-preview { display: flex; align-items: center; gap: 12px; border-radius: 16px; padding: 12px 16px; background: #f5f3ff; }
  .chapter-preview span:first-child { font-size: 28px; }
  .chapter-preview span:last-child { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 18px; color: var(--ink); }
  .btn-ghost { background: none; border: none; cursor: pointer; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: var(--muted); padding: 8px; width: 100%; text-align: center; }

  /* ── CURRENT CHAPTER ── */
  .current-inner { max-width: 672px; margin: 0 auto; padding: 48px 20px 40px; display: flex; flex-direction: column; }
  .back-btn { font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: var(--muted); background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 4px; margin-bottom: 24px; padding: 0; }
  .chapter-header { display: flex; align-items: center; gap: 16px; margin-bottom: 32px; }
  .chapter-icon-box { width: 64px; height: 64px; display: flex; align-items: center; justify-content: center; border-radius: 16px; background: #ede9fe; flex-shrink: 0; font-size: 36px; }
  .chapter-header-title { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 24px; color: var(--ink); }
  .chapter-header-sub { font-family: 'Nunito', sans-serif; font-size: 14px; color: var(--muted); margin-top: 2px; }
  .action-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 32px; }
  .action-card {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; border-radius: 24px; padding: 32px 0;
    border: none; cursor: pointer; transition: transform 0.15s;
  }
  .action-card:active { transform: scale(0.95); }
  .action-card-new { background: var(--purple); box-shadow: 0 6px 24px rgba(124,58,237,0.3); }
  .action-card-revision { background: white; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
  .action-card-revision:disabled { opacity: 0.4; cursor: not-allowed; }
  .action-icon-circle { width: 52px; height: 52px; border-radius: 999px; display: flex; align-items: center; justify-content: center; }
  .action-label { font-family: 'Baloo 2', sans-serif; font-weight: 800; font-size: 20px; }

  /* ── HOME / SCAN ── */
  .scan-inner { max-width: 512px; margin: 0 auto; padding: 0 20px; display: flex; flex-direction: column; height: 100%; }
  .scan-idle { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 32px; padding-bottom: 40px; }
  .camera-btn {
    width: 110px; height: 110px; border-radius: 50%; background: var(--purple);
    box-shadow: 0 8px 32px rgba(124,58,237,0.35); border: none; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: transform 0.15s;
  }
  .camera-btn:active { transform: scale(0.95); }
  .scan-hint { font-family: 'Nunito', sans-serif; font-size: 14px; color: var(--muted); text-align: center; }

  .img-previews { display: flex; flex-wrap: wrap; gap: 12px; }
  .img-preview-wrap { position: relative; width: 90px; height: 90px; border-radius: 16px; overflow: hidden; border: 2px solid #f3f4f6; }
  .img-preview-wrap img { width: 100%; height: 100%; object-fit: cover; }
  .img-remove { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; background: #ef4444; color: white; border: none; border-radius: 999px; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .img-num { position: absolute; bottom: 4px; left: 4px; background: rgba(0,0,0,0.5); color: white; font-size: 12px; font-weight: 700; border-radius: 4px; padding: 0 4px; }
  .img-add-btn { width: 90px; height: 90px; border-radius: 16px; border: 2px dashed #e5e7eb; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 24px; transition: background 0.15s; }
  .img-add-btn:active { background: #f9fafb; }
  .generate-btn { width: 100%; background: var(--purple); box-shadow: 0 4px 16px rgba(124,58,237,0.3); color: white; border: none; border-radius: 16px; padding: 20px; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 18px; cursor: pointer; transition: transform 0.15s; }
  .generate-btn:active { transform: scale(0.97); }
  .cancel-btn { width: 100%; background: none; border: none; cursor: pointer; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 14px; color: var(--muted); padding: 8px; text-align: center; }

  .loading-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 40px 24px; text-align: center; }
  .spinner { width: 48px; height: 48px; border: 4px solid #f3f4f6; border-top-color: var(--purple); border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 0 16px 40px; text-align: center; }

  /* ── QUIZ INTRO ── */
  .quiz-intro { height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; background: white; position: relative; }
  .quiz-intro-inner { width: 100%; max-width: 320px; display: flex; flex-direction: column; align-items: center; gap: 24px; }

  /* ── QUIZ ── */
  .quiz-wrap { height: 100dvh; display: flex; align-items: center; justify-content: center; background: white; overflow: hidden; }
  .quiz-inner { display: flex; flex-direction: column; background: white; width: 100%; max-width: 384px; height: 100dvh; }
  .quiz-topbar { flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 8px 16px 4px; }
  .quit-btn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 999px; color: #d1d5db; background: none; border: none; cursor: pointer; }
  .quit-btn:active { background: #f3f4f6; }
  .progress-bar-wrap { flex: 1; height: 12px; border-radius: 999px; overflow: hidden; background: #f3f4f6; }
  .progress-bar { height: 100%; border-radius: 999px; background: var(--purple); transition: transform 350ms cubic-bezier(0.4,0,0.2,1); transform-origin: left; }
  .progress-bar.on-fire { background: linear-gradient(90deg, #ff4b4b, #ff9600); }
  .quiz-qnum { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 14px; color: var(--muted); }
  .quiz-topic { flex-shrink: 0; padding: 8px 20px 4px; font-family: 'Nunito', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--purple); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .quiz-question { flex-shrink: 0; padding: 16px 24px 12px; max-height: 30%; overflow-y: auto; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 24px; color: var(--ink); line-height: 1.3; }
  .quiz-answers { padding: 0 16px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
  .quiz-bottom { flex-shrink: 0; padding: 8px 16px 24px; }

  .mcq-btn {
    width: 100%; border-radius: 16px; border: 2px solid #e5e7eb; background: white;
    color: var(--ink); font-family: 'Baloo 2', sans-serif; font-weight: 700;
    font-size: 18px; padding: 16px 20px; text-align: left; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.05); transition: all 0.1s;
  }
  .mcq-btn:disabled { cursor: not-allowed; }
  .mcq-btn.selected { border-color: #a78bfa; background: #f5f3ff; color: var(--purple); }
  .mcq-btn.correct { border-color: #86efac; background: #f0fdf4; color: #16a34a; }
  .mcq-btn.wrong { border-color: #fca5a5; background: #fff5f5; color: #ef4444; }
  .mcq-btn.faded { border-color: #f3f4f6; color: #d1d5db; }

  .tf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tf-btn { width: 100%; height: 112px; border-radius: 16px; border: 2px solid #e5e7eb; background: white; color: var(--ink); font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 30px; cursor: pointer; transition: all 0.1s; display: flex; align-items: center; justify-content: center; }
  .tf-btn:disabled { cursor: not-allowed; }
  .tf-btn.selected { border-color: #a78bfa; background: #f5f3ff; color: var(--purple); }
  .tf-btn.correct { border-color: #86efac; background: #f0fdf4; color: #16a34a; }
  .tf-btn.wrong { border-color: #fca5a5; background: #fff5f5; color: #ef4444; }
  .tf-btn.faded { border-color: #f3f4f6; color: #d1d5db; }

  .fill-input { width: 100%; border-radius: 16px; padding: 16px; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 20px; color: var(--ink); border: 2px solid #e5e7eb; background: #fafafa; outline: none; transition: border-color 0.15s; direction: ltr; unicode-bidi: isolate; text-align: left; }
  .fill-input:focus { border-color: var(--purple); }
  .fill-input.correct { border-color: #86efac; background: #f0fdf4; }
  .fill-input.wrong { border-color: #fca5a5; background: #fff5f5; }
  .correct-answer-hint { font-family: 'Nunito', sans-serif; font-size: 14px; font-weight: 700; color: var(--purple); padding: 0 4px; margin-top: 4px; }

  .visual-count-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; border-radius: 16px; padding: 20px 16px; margin-bottom: 16px; background: #fafafa; border: 2px solid #f3f4f6; }

  .highlight-wrap { line-height: 2.2; padding: 4px 0; }
  .highlight-word {
    display: inline; border-radius: 8px; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 19px;
    padding: 3px 6px; margin: 2px 1px; border: none; background: transparent; color: var(--ink);
    cursor: pointer; transition: background 0.1s, color 0.1s; vertical-align: baseline;
  }
  .highlight-word:disabled { cursor: not-allowed; }
  .highlight-word.selected { background: #ede9fe; color: var(--purple); border-radius: 8px; }
  .highlight-word.correct-selected { background: #dcfce7; color: #16a34a; }
  .highlight-word.wrong-selected { background: #fee2e2; color: #ef4444; }
  .highlight-word.missed { background: #fff7ed; color: #d97706; text-decoration: underline dotted #fdba74; }

  .explanation-box { margin-top: 16px; border-radius: 16px; padding: 12px 16px; background: #f5f3ff; border: 2px solid #ede9fe; font-family: 'Nunito', sans-serif; font-size: 14px; color: var(--purple); line-height: 1.5; }

  .check-btn { width: 100%; background: var(--purple); box-shadow: 0 4px 0 var(--purple-dark); color: white; border: none; border-radius: 16px; padding: 20px; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.05em; cursor: pointer; transition: transform 0.1s; }
  .check-btn:active { transform: scale(0.97); }
  .check-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .feedback-box { border-radius: 16px; overflow: hidden; border: 2px solid; }
  .feedback-top { display: flex; align-items: center; gap: 12px; padding: 12px 16px; }
  .feedback-label { font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 18px; color: var(--ink); }
  .continue-btn { width: 100%; padding: 16px; font-family: 'Baloo 2', sans-serif; font-weight: 700; font-size: 20px; letter-spacing: 0.05em; color: white; border: none; cursor: pointer; transition: transform 0.1s; }
  .continue-btn:active { transform: scale(0.98); }

  /* ── STREAK POPUP ── */
  .streak-popup { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; background: #1a0a14; height: 100dvh; }
  .streak-popup-inner { width: 100%; max-width: 320px; display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center; }

// ── NORMALIZE (for answer checking) ──────────────────────────────────────
function normalize(str) {
  return String(str ?? '').trim().toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[\u064B-\u0652\u0640]/g, '')
    .replace(/[\u0622\u0623\u0625]/g, '\u0627')
    .replace(/\u0629/g, '\u0647').replace(/\u0649/g, '\u064a')
    .replace(/^\u0627\u0644/, '')
    .replace(/[\u0660-\u0669]/g, d => String(d.charCodeAt(0) - 0x0660))
    .replace(/^(les|des|un|une|le|la|l'|the|a|an)\s+/i, '').trim()
    .replace(/[.,!?;:"']/g, '')
}
function answersMatch(a, b) {
  const na = normalize(a), nb = normalize(b)
  if (na === nb) return true
  const isLatin = s => /^[\x20-\x7E]+$/.test(s)
  if (isLatin(na) && isLatin(nb)) return na.replace(/s$/, '') === nb.replace(/s$/, '')
  return false
}
function wordSetMatches(sel, targets) {
  if (!Array.isArray(sel) || !Array.isArray(targets)) return false
  // Flatten: target_words may contain multi-word strings like "les oiseaux"
  // Split each target by spaces so ["les oiseaux"] == selecting ["les","oiseaux"]
  const flatTargets = targets.flatMap(t => t.split(' ').filter(Boolean))
  if (sel.length !== flatTargets.length) return false
  const norm = arr => arr.map(normalize).sort()
  const a = norm(sel), b = norm(flatTargets)
  return a.every((w, i) => w === b[i])
}
function isAnswerCorrect(q, answer) {
  if (!q) return false
  if (q.type === 'text_highlight') {
    if (!Array.isArray(answer)) return false
    const FORGIVEN = new Set(['the','a','an','and','or','but','les','des','le','la','l','un','une','et','ou','de','du','d'])
    // Strip forgiven filler words (articles, conjunctions) from the answer
    const meaningfulAnswer = answer.filter(w => !FORGIVEN.has(normalize(w)))
    const words = q.text.split(' ')
    const targets = q.target_words || []
    const expectedWords = targets.flatMap(t => {
      const phraseWords = t.split(' ').filter(Boolean).map(normalize)
      for (let wi = 0; wi <= words.length - phraseWords.length; wi++) {
        if (phraseWords.every((pw, pi) => normalize(words[wi+pi]) === pw))
          return phraseWords.map((_, pi) => words[wi+pi])
      }
      return t.split(' ').filter(Boolean)
    })
    if (meaningfulAnswer.length !== expectedWords.length) return false
    return wordSetMatches(meaningfulAnswer, expectedWords)
  }
  return answersMatch(answer, q.correct_answer)
}

}

// ── IMAGE COMPRESSION ────────────────────────────────────────────────────
async function compressImage(file, maxW = 1600, quality = 0.82) {
  return new Promise(resolve => {
    const img = new Image()
    const url = URL.createObjectURL(file)
    img.onload = () => {
      URL.revokeObjectURL(url)
      const scale = Math.min(1, maxW / img.width)
      const canvas = document.createElement('canvas')
      canvas.width = Math.round(img.width * scale)
      canvas.height = Math.round(img.height * scale)
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height)
      canvas.toBlob(blob => resolve(new File([blob], file.name, { type: 'image/jpeg' })), 'image/jpeg', quality)
    }
    img.src = url
  })
}
async function fileToBase64(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader()
    r.onload = () => resolve(r.result.split(',')[1])
    r.onerror = reject
    r.readAsDataURL(file)
  })
}

// ── SUPABASE AUTH + TRIAL SESSION ────────────────────────────────────────
const LS_KEY = 'numio_trial_v1'

function saveLocal(data) {
  try { localStorage.setItem(LS_KEY, JSON.stringify(data)) } catch(e) {}
}

function loadLocal() {
  try { return JSON.parse(localStorage.getItem(LS_KEY) || 'null') } catch(e) { return null }
}

async function init() {
  render() // show spinner
  try {
    // Sign in anonymously
    const { data, error } = await sb.auth.signInAnonymously()
    if (error) throw error
    state.session = data.session

    // Check or create trial session (browser fingerprint = anon user id)
    const userId = data.session.user.id
    const { data: existing } = await sb.from('trial_sessions').select('*').eq('anonymous_id', userId).maybeSingle()
    const local = loadLocal()
    if (existing) {
      state.trialSessionId = existing.id
      state.trialUsed = existing.quiz_used
      state.streak = existing.streak || 0
      state.coins = existing.coins || 0
      // Merge: prefer localStorage chapters (they carry exam objects) over plain DB chapters
      const dbChapters = existing.chapters || []
      const localChapters = local?.chapters || []
      // If localStorage has more data (exam objects), prefer it; otherwise use DB
      state.chapters = localChapters.length >= dbChapters.length && localChapters.some(c => c.exam)
        ? localChapters
        : dbChapters
    } else {
      const { data: created } = await sb.from('trial_sessions').insert({ anonymous_id: userId }).select().single()
      state.trialSessionId = created.id
      // Restore from localStorage if available (e.g. after browser refresh before Supabase row existed)
      if (local) {
        state.trialUsed = local.quiz_used || false
        state.streak = local.streak || 0
        state.coins = local.coins || 0
        state.chapters = local.chapters || []
      }
    }
    // Always sync localStorage with current state
    saveLocal({ quiz_used: state.trialUsed, streak: state.streak, coins: state.coins, chapters: state.chapters })
  } catch (e) {
    console.error('Init error:', e)
  }
  setState({})
}

async function saveTrialSession(updates) {
  // Always write localStorage immediately (instant, survives refresh)
  const current = loadLocal() || {}
  saveLocal({ ...current, ...updates })
  // Then sync to Supabase in background
  if (!state.trialSessionId) return
  await sb.from('trial_sessions').update(updates).eq('id', state.trialSessionId)
}

// ── GENERATE QUIZ ─────────────────────────────────────────────────────────
async function generateTrialQuiz(images) {
  const token = state.session?.access_token
  const res = await fetch(EDGE_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
    body: JSON.stringify({ images, trial_session_id: state.trialSessionId })
  })
  if (!res.ok) {
    const err = await res.json().catch(() => ({ error: 'Unknown error' }))
    throw new Error(err.error || 'Failed to generate quiz')
  }
  return res.json()
}

// ── QUIZ FLOW ─────────────────────────────────────────────────────────────
async function handleGenerate() {
  if (!state.scanImages.length) return
  if (state.trialUsed) { setState({ trialUsedVisible: true }); return }
  setState({ scanStatus: 'loading', scanError: null })
  try {
    const compressed = await Promise.all(state.scanImages.map(i => compressImage(i.file)))
    const b64images = await Promise.all(compressed.map(async f => ({ data: await fileToBase64(f), mediaType: 'image/jpeg' })))
    const exam = await generateTrialQuiz(b64images)
    // mark trial used
    const newStreak = state.streak + 1
    const newCoins = state.coins + (exam.questions?.length || 3) * 2
    // Save exam to the chapter so revision works
    const updatedChapter = { ...state.chapter, examCount: 1, exam }
    const updatedChapters = state.chapters.map(ch => ch.id === updatedChapter.id ? updatedChapter : ch)
    setState({ trialUsed: true, streak: newStreak, coins: newCoins, exam, scanStatus: 'idle', scanImages: [], chapter: updatedChapter, chapters: updatedChapters })
    saveTrialSession({ quiz_used: true, streak: newStreak, coins: newCoins, chapters: updatedChapters })
    go('quiz_intro', { exam })
  } catch (err) {
    setState({ scanStatus: 'error', scanError: err })
  }
}

// ── QUIZ LOGIC ────────────────────────────────────────────────────────────
function currentAnswer() {
  const q = state.exam?.questions?.[state.quizIdx]
  if (!q) return null
  if (q.type === 'fill_blank') return (document.getElementById('fill-input')?.value ?? state.quizTypedValue)
  if (q.type === 'text_highlight') return state.quizHighlightIdx.map(i => q.text.split(' ')[i])
  return state.quizSelected
}

function handleCheck() {
  const q = state.exam?.questions?.[state.quizIdx]
  if (q?.type === 'fill_blank') {
    state.quizTypedValue = document.getElementById('fill-input')?.value ?? ''
  }
  const answer = currentAnswer()
  const empty = q?.type === 'text_highlight' ? state.quizHighlightIdx.length === 0 : (!answer && answer !== false)
  if (empty) return
  const correct = isAnswerCorrect(q, answer)
  const newConsec = correct ? state.quizConsecutiveCorrect + 1 : 0
  setState({ quizRevealed: true, quizConsecutiveCorrect: newConsec, quizFireKey: correct && newConsec >= 2 ? state.quizFireKey + 1 : state.quizFireKey })
}

function handleContinue() {
  const answer = currentAnswer()
  const questions = state.exam?.questions || []
  const newAnswers = [...state.quizAnswers, answer]
  if (state.quizIdx === questions.length - 1) {
    // quiz done — show streak popup then results
    const newStreak = state.streak // already updated
    setState({ quizAnswers: newAnswers, quizShowStreak: true, quizStreakCount: newStreak })
    return
  }
  setState({ quizIdx: state.quizIdx + 1, quizAnswers: newAnswers, quizSelected: null, quizRevealed: false, quizTypedValue: '', quizHighlightIdx: [] })
}

function resetQuizState() {
  setState({ quizIdx: 0, quizAnswers: [], quizSelected: null, quizRevealed: false, quizTypedValue: '', quizHighlightIdx: [], quizShowQuit: false, quizShowResults: false, quizShowStreak: false, quizConsecutiveCorrect: 0, quizFireKey: 0, quizCoinsEarned: 0 })
}

// ── QUIZ ──────────────────────────────────────────────────────────────────
function renderQuiz() {
  const s = state; const lang = s.lang
  if (s.quizShowStreak) return renderStreakPopup()
  if (s.quizShowResults) return renderResults()

  const questions = s.exam?.questions || []
  const q = questions[s.quizIdx]
  if (!q) return ''

  const total = questions.length
  const onFire = s.quizConsecutiveCorrect >= 2
  const progressScale = (s.quizIdx + (s.quizRevealed ? 1 : 0)) / Math.max(total, 1)
  const answer = currentAnswer()
  const isCorrect = s.quizRevealed && isAnswerCorrect(q, answer)

  let answersHtml = ''
  if (q.type === 'mcq') {
    const itemsHtml = q.items?.length ? `<div style="display:flex;flex-direction:column;gap:6px;margin-bottom:16px;background:#f8f7ff;border-radius:16px;padding:12px 16px;">
      ${q.items.map((item,i)=>`<div style="display:flex;align-items:flex-start;gap:10px;"><span style="font-family:'Baloo 2',sans-serif;font-weight:800;font-size:15px;color:var(--purple);min-width:20px;">${i+1}.</span><span style="font-size:15px;color:var(--ink);line-height:1.4;">${item}</span></div>`).join('')}
    </div>` : ''
    answersHtml = `${itemsHtml}<div style="display:flex;flex-direction:column;gap:12px;">
      ${q.options.map(opt => {
        let cls = 'mcq-btn'
        if (s.quizRevealed) {
          if (opt === q.correct_answer) cls += ' correct'
          else if (opt === s.quizSelected) cls += ' wrong'
          else cls += ' faded'
        } else if (opt === s.quizSelected) cls += ' selected'
        return `<button class="${cls}" data-mcq="${encodeURIComponent(opt)}" ${s.quizRevealed?'disabled':''}>${opt}</button>`
      }).join('')}
    </div>`
  } else if (q.type === 'true_false') {
    const opts = getTrueFalseOptions(q.correct_answer)
    answersHtml = `<div class="tf-grid">
      ${opts.map(opt => {
        let cls = 'tf-btn'
        if (s.quizRevealed) {
          if (answersMatch(opt, q.correct_answer)) cls += ' correct'
          else if (opt === s.quizSelected) cls += ' wrong'
          else cls += ' faded'
        } else if (opt === s.quizSelected) cls += ' selected'
        return `<button class="${cls}" data-mcq="${encodeURIComponent(opt)}" ${s.quizRevealed?'disabled':''}>${opt}</button>`
      }).join('')}
    </div>`
  } else if (q.type === 'fill_blank') {
    const fillCorrect = s.quizRevealed && isAnswerCorrect(q, s.quizTypedValue)
    answersHtml = `<div style="display:flex;flex-direction:column;gap:8px;">
      <input type="text" id="fill-input" class="fill-input ${s.quizRevealed?(fillCorrect?'correct':'wrong'):''}" 
        value="${s.quizTypedValue.replace(/"/g,'&quot;')}" 
        placeholder="${t(lang,'quiz_fill_placeholder')}"
        ${s.quizRevealed?'disabled':''} dir="auto" />
      ${s.quizRevealed && !fillCorrect ? `<p class="correct-answer-hint">${t(lang,'quiz_correct_answer',q.correct_answer)}</p>` : ''}
    </div>`
  } else if (q.type === 'visual_count') {
    const assetUrl = getAssetUrl(q.asset)
    answersHtml = `<div>
      <div class="visual-count-row">
        ${Array.from({length:q.quantity}).map(()=>assetUrl?`<img src="${assetUrl}" alt="${q.asset}" style="width:40px;height:40px;">`:`<span style="font-size:36px;">❓</span>`).join('')}
      </div>
      <div class="tf-grid">
        ${q.options.map(opt => {
          let cls = 'tf-btn'
          if (s.quizRevealed) {
            if (String(opt) === String(q.correct_answer)) cls += ' correct'
            else if (opt === s.quizSelected) cls += ' wrong'
            else cls += ' faded'
          } else if (opt === s.quizSelected) cls += ' selected'
          return `<button class="${cls}" data-mcq="${opt}" ${s.quizRevealed?'disabled':''}>${opt}</button>`
        }).join('')}
      </div>
    </div>`
  } else if (q.type === 'text_highlight') {
    const words = q.text.split(' ')
    const phraseGroups = (q.target_words||[]).map(phrase => {
      const phraseWords = phrase.split(' ').filter(Boolean).map(normalize)
      for (let wi = 0; wi <= words.length - phraseWords.length; wi++) {
        if (phraseWords.every((pw,pi) => normalize(words[wi+pi]) === pw))
          return phraseWords.map((_,pi) => wi+pi)
      }
      return []
    })
    const allTargetIdx = phraseGroups.flat()
    answersHtml = `<div class="highlight-wrap">
      ${words.map((word,i)=>{
        const isSel = s.quizHighlightIdx.includes(i)
        const isTarget = allTargetIdx.includes(i)
        const phraseComplete = phraseGroups.some(g => g.includes(i) && g.every(gi => s.quizHighlightIdx.includes(gi)))
        let cls = 'highlight-word'
        const FORGIVEN = new Set(['the','a','an','and','or','but','les','des','le','la','l','un','une','et','ou','de','du','d'])
        if (s.quizRevealed) {
          if (isTarget && phraseComplete) cls += ' correct-selected'
          else if (isTarget && !phraseComplete) cls += ' missed'
          else if (isSel && !isTarget && !FORGIVEN.has(normalize(word))) cls += ' wrong-selected'
          // forgiven filler words shown as neutral when selected
        } else if (isSel) cls += ' selected'
        return `<button class="${cls}" data-wordidx="${i}" ${s.quizRevealed?'disabled':''}>${word}</button> `
      }).join('')}
    </div>`
  }

  const explanationHtml = s.quizRevealed && q.explanation
    ? `<div class="explanation-box">💡 ${q.explanation}</div>` : ''

  const checkDisabled = q.type==='fill_blank' ? s.quizTypedValue.trim()==='' :
    q.type==='text_highlight' ? s.quizHighlightIdx.length===0 : s.quizSelected===null

  const bottomHtml = !s.quizRevealed
    ? `<button class="check-btn" id="btn-check" ${checkDisabled?'disabled':''}>${t(lang,'quiz_check')}</button>`
    : `<div class="feedback-box" style="border-color:${isCorrect?'#86efac':'#fca5a5'};background:${isCorrect?'#f0fdf4':'#fff5f5'}">
        <div class="feedback-top">
          <span style="font-size:24px;">${isCorrect?'🎉':'💪'}</span>
          <p class="feedback-label">${isCorrect?t(lang,'quiz_correct'):t(lang,'quiz_not_quite')}</p>
        </div>
        <button class="continue-btn" id="btn-continue"
          style="background:${isCorrect?'var(--purple)':'#f59e0b'};box-shadow:0 4px 0 ${isCorrect?'var(--purple-dark)':'#d97706'}">
          ${t(lang,'quiz_continue')}
        </button>
      </div>`

  return `<div class="quiz-wrap">
    ${s.quizShowQuit ? renderQuitPopup() : ''}
    ${onFire && s.quizRevealed ? renderFireOverlay() : ''}
    <div class="quiz-inner">
      <div class="quiz-topbar">
        <button class="quit-btn" id="btn-quit-quiz">
          <svg width="40" height="40" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M4 4l12 12M16 4L4 16"/></svg>
        </button>
        <div class="progress-bar-wrap">
          <div class="progress-bar${onFire&&s.quizRevealed?' on-fire':''}" style="transform:scaleX(${progressScale})"></div>
        </div>
        <span class="quiz-qnum">${s.quizIdx+1}/${total}</span>
      </div>
      <div class="quiz-topic">${exam?.topic||''}</div>
      <div class="quiz-question">${q.question}</div>
      <div class="quiz-answers">${answersHtml}${explanationHtml}</div>
      <div class="quiz-bottom">${bottomHtml}</div>
    </div>
    <style>@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}</style>
  </div>`
}

function renderFireOverlay() {
  const fires = Array.from({length:20},()=>({left:Math.random()*100,delay:(Math.random()*0.5).toFixed(2),dur:(0.8+Math.random()*0.8).toFixed(2),size:28+Math.random()*32}))
  const heads = Array.from({length:8},()=>({left:Math.random()*95,delay:(Math.random()*0.6).toFixed(2),dur:(0.9+Math.random()).toFixed(2),size:50+Math.random()*60,rot:((Math.random()-0.5)*60).toFixed(1)}))
  return `<div class="fire-overlay" key="${state.quizFireKey}">
    ${fires.map(p=>`<div style="position:absolute;bottom:-80px;left:${p.left}%;font-size:${p.size}px;opacity:0;animation:fire-rise ${p.dur}s ${p.delay}s ease-out both">🔥</div>`).join('')}
    ${heads.map(p=>`<div style="position:absolute;bottom:-100px;left:${p.left}%;width:${p.size}px;height:${p.size}px;opacity:0;transform:rotate(${p.rot}deg);animation:fire-rise ${p.dur}s ${p.delay}s ease-out both"><img src="/nav-profile.png" alt="" style="width:100%;height:100%;object-fit:contain;"/></div>`).join('')}
  </div>`
}

function renderStreakPopup() {
  const s = state; const lang = s.lang; const streak = s.quizStreakCount
  const isFirst = streak===1
  const isMilestone = [3,5,7,10,14,21,30].includes(streak)
  let headline, sub
  if (isFirst) { headline=t(lang,'streak_first_headline'); sub=t(lang,'streak_first_sub') }
  else if (isMilestone) { headline=t(lang,'streak_milestone_headline',streak); sub=t(lang,'streak_milestone_sub') }
  else { headline=t(lang,'streak_default_headline',streak); sub=t(lang,'streak_default_sub') }
  const dots = Array.from({length:Math.min(streak,7)})
  return `<div class="streak-popup">
    <div class="streak-popup-inner">
      <img src="/streak-fire.png" alt="" style="width:192px;height:auto;animation:float 2s ease-in-out infinite;" />
      <div>
        <h2 class="font-display" style="font-size:36px;font-weight:800;color:white;">${headline}</h2>
        <p style="font-size:16px;color:rgba(255,255,255,0.5);margin-top:8px;">${sub}</p>
      </div>
      <div class="streak-dots">
        ${dots.map(()=>`<div class="streak-dot">✓</div>`).join('')}
        ${streak>7?`<span class="font-display" style="font-size:24px;font-weight:800;color:#ff2d78">+${streak-7}</span>`:''}
      </div>
      <button class="btn-purple" id="btn-streak-done" style="background:#ff2d78;box-shadow:0 4px 0 #c4005a;max-width:100%;font-size:18px;">${t(lang,'streak_cta')}</button>
    </div>
    <style>@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}</style>
  </div>`
}

function renderResults() {
  const s = state; const lang = s.lang
  const questions = s.exam?.questions || []
  const answers = s.quizAnswers
  const correct = questions.filter((q,i)=>isAnswerCorrect(q,answers[i])).length
  const total = questions.length
  const pct = Math.round((correct/total)*100)

  let emoji, headlineKey, subKey
  if (pct===100) { emoji='🏆'; headlineKey='quiz_results_perfect'; subKey='quiz_results_perfect_sub' }
  else if (pct>=80) { emoji='🎉'; headlineKey='quiz_results_great'; subKey='quiz_results_great_sub' }
  else if (pct>=60) { emoji='😊'; headlineKey='quiz_results_good'; subKey='quiz_results_good_sub' }
  else { emoji='💪'; headlineKey='quiz_results_keep'; subKey='quiz_results_keep_sub' }

  const coinsEarned = s.quizCoinsEarned || total * 2

  return `<div class="results-screen">
    <div class="results-inner">
      <img src="/nav-profile.png" alt="" style="width:128px;height:auto;animation:float 2s ease-in-out infinite;" />
      <div style="text-align:center;">
        <p style="font-size:48px;">${emoji}</p>
        <h2 class="font-display" style="font-size:30px;font-weight:800;color:var(--ink);margin-top:4px;">${t(lang,headlineKey)}</h2>
        <p style="font-size:16px;color:var(--muted);margin-top:4px;">${t(lang,subKey)}</p>
      </div>
      <div class="score-box" style="background:#1a1200;box-shadow:0 4px 24px rgba(251,191,36,0.2);">
        <img src="/coin-flower.png" alt="coins" style="width:56px;height:56px;object-fit:contain;animation:float 2s ease-in-out infinite;" />
        <div>
          <p style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:rgba(251,191,36,0.6);">Coins earned</p>
          <p class="font-display" style="font-size:40px;font-weight:800;color:#fbbf24;line-height:1;">+${coinsEarned}</p>
        </div>
      </div>
      <div class="score-box" style="background:#f5f3ff;">
        <span style="font-size:40px;">🎯</span>
        <div>
          <p style="font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--purple);">Your score</p>
          <p class="font-display" style="font-size:36px;font-weight:800;color:var(--purple);line-height:1;">${correct}/${total}</p>
        </div>
      </div>
      <button class="btn-purple" id="btn-results-done">← Back to Home</button>
    </div>
    <style>@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}</style>
  </div>`
}

// ── ATTACH LISTENERS ──────────────────────────────────────────────────────
let exam // reference for quiz
function attachListeners() {
  const s = state

  // Nav
  document.querySelectorAll('[data-nav]').forEach(btn => {
    btn.addEventListener('click', () => handleTabChange(btn.dataset.nav))
  })

  // Streak/coins modals on chapters
  const btnStreak = document.getElementById('btn-streak-modal')
  if (btnStreak) btnStreak.addEventListener('click', () => setState({ showStreakModal: true }))
  const btnCoins = document.getElementById('btn-coins-modal')
  if (btnCoins) btnCoins.addEventListener('click', () => setState({ showCoinsModal: true }))
  const closeStreak = document.getElementById('closeStreakModal')
  if (closeStreak) closeStreak.addEventListener('click', () => setState({ showStreakModal: false }))
  const closeCoins = document.getElementById('closeCoinsModal')
  if (closeCoins) closeCoins.addEventListener('click', () => setState({ showCoinsModal: false }))

  // Chapters
  const btnAdd = document.getElementById('btn-add-chapter')
  if (btnAdd) btnAdd.addEventListener('click', () => setState({ showChapterModal: true }))
  document.querySelectorAll('[data-chapter]').forEach(btn => {
    btn.addEventListener('click', () => {
      const ch = s.chapters.find(c => c.id === btn.dataset.chapter)
      if (ch) setState({ chapter: ch, screen: 'current_chapter', activeTab: 'chapters' })
    })
  })

  // Chapter modal
  const nameInput = document.getElementById('chapter-name-input')
  if (nameInput) {
    nameInput.setAttribute('dir', 'ltr')
    nameInput.style.direction = 'ltr'
    nameInput.addEventListener('input', e => setState({ newChapterName: e.target.value }))
    nameInput.focus()
    // Move cursor to end (LTR position)
    const len = nameInput.value.length
    nameInput.setSelectionRange(len, len)
  }
  document.querySelectorAll('[data-emoji]').forEach(btn => {
    btn.addEventListener('click', () => setState({ newChapterEmoji: btn.dataset.emoji }))
  })
  const confirmChapter = document.getElementById('btn-confirm-chapter')
  if (confirmChapter) confirmChapter.addEventListener('click', () => {
    if (s.newChapterName.trim()) createChapter(s.newChapterName.trim(), s.newChapterEmoji)
  })
  const closeModal = document.getElementById('btn-close-modal')
  if (closeModal) closeModal.addEventListener('click', () => setState({ showChapterModal: false }))
  const overlay = document.getElementById('modal-overlay')
  if (overlay) overlay.addEventListener('click', e => { if (e.target === overlay) setState({ showChapterModal: false }) })

  // Current Chapter
  const backChapters = document.getElementById('btn-back-chapters')
  if (backChapters) backChapters.addEventListener('click', () => setState({ screen: 'chapters', activeTab: 'chapters' }))
  const btnNewQuiz = document.getElementById('btn-new-quiz')
  if (btnNewQuiz) btnNewQuiz.addEventListener('click', () => {
    if (s.trialUsed) { setState({ trialUsedVisible: true }); return }
    setState({ screen: 'scan', scanStatus: 'idle', scanImages: [], scanError: null })
  })
  const btnRevision = document.getElementById('btn-revision')
  if (btnRevision && s.chapter?.exam) {
    btnRevision.addEventListener('click', () => setState({ screen: 'revisions' }))
  }
  const btnBackRevisions = document.getElementById('btn-back-chapter-from-revisions')
  if (btnBackRevisions) btnBackRevisions.addEventListener('click', () => setState({ screen: 'current_chapter' }))
  const btnStartRevision = document.getElementById('btn-start-revision')
  if (btnStartRevision) btnStartRevision.addEventListener('click', () => setState({ exam: s.chapter.exam, screen: 'quiz_intro' }))

  // Scan
  const backChapter = document.getElementById('btn-back-chapter')
  if (backChapter) backChapter.addEventListener('click', () => setState({ screen: 'current_chapter' }))
  const btnCamera = document.getElementById('btn-camera')
  const fileInput = document.getElementById('file-input')
  if (btnCamera && fileInput) {
    btnCamera.addEventListener('click', () => fileInput.click())
    fileInput.addEventListener('change', e => {
      const files = Array.from(e.target.files || [])
      if (!files.length) return
      const newImgs = files.map(f => ({ file: f, preview: URL.createObjectURL(f) }))
      setState({ scanImages: [...s.scanImages, ...newImgs].slice(0,5), scanStatus: 'review' })
    })
  }
  const btnAddMore = document.getElementById('btn-add-more')
  if (btnAddMore && fileInput) btnAddMore.addEventListener('click', () => fileInput.click())
  document.querySelectorAll('[data-remove]').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.remove)
      const next = s.scanImages.filter((_,i)=>i!==idx)
      setState({ scanImages: next, scanStatus: next.length > 0 ? 'review' : 'idle' })
    })
  })
  const btnGenerate = document.getElementById('btn-generate')
  if (btnGenerate) btnGenerate.addEventListener('click', handleGenerate)
  const btnCancelScan = document.getElementById('btn-cancel-scan')
  if (btnCancelScan) btnCancelScan.addEventListener('click', () => setState({ scanImages: [], scanStatus: 'idle' }))
  const btnTryAgain = document.getElementById('btn-try-again')
  if (btnTryAgain) btnTryAgain.addEventListener('click', () => setState({ scanImages: [], scanStatus: 'idle', scanError: null }))

  // Quiz Intro
  const backScan = document.getElementById('btn-back-scan')
  if (backScan) backScan.addEventListener('click', () => setState({ screen: 'current_chapter' }))
  const btnStart = document.getElementById('btn-start-quiz')
  if (btnStart) btnStart.addEventListener('click', () => {
    resetQuizState()
    setState({ screen: 'quiz' })
  })

  // Quiz
  const btnQuit = document.getElementById('btn-quit-quiz')
  if (btnQuit) btnQuit.addEventListener('click', () => setState({ quizShowQuit: true }))
  const btnQuitStay = document.getElementById('btn-quit-stay')
  if (btnQuitStay) btnQuitStay.addEventListener('click', () => setState({ quizShowQuit: false }))
  const btnQuitLeave = document.getElementById('btn-quit-leave')
  if (btnQuitLeave) btnQuitLeave.addEventListener('click', () => {
    resetQuizState()
    setState({ screen: 'current_chapter', quizShowQuit: false })
  })

  // MCQ / TF
  document.querySelectorAll('[data-mcq]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (s.quizRevealed) return
      setState({ quizSelected: decodeURIComponent(btn.dataset.mcq) })
    })
  })
  // Fill blank
  const fillInp = document.getElementById('fill-input')
  if (fillInp) {
    fillInp.addEventListener('input', e => {
      const btn = document.getElementById('btn-check')
      if (btn) btn.disabled = e.target.value.trim() === ''
    })
    if (document.activeElement !== fillInp) fillInp.focus()
  }

  // Text highlight
  document.querySelectorAll('[data-wordidx]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (s.quizRevealed) return
      const i = parseInt(btn.dataset.wordidx)
      const next = s.quizHighlightIdx.includes(i) ? s.quizHighlightIdx.filter(x=>x!==i) : [...s.quizHighlightIdx, i]
      setState({ quizHighlightIdx: next })
    })
  })

  const btnCheck = document.getElementById('btn-check')
  if (btnCheck) btnCheck.addEventListener('click', handleCheck)
  const btnContinue = document.getElementById('btn-continue')
  if (btnContinue) btnContinue.addEventListener('click', handleContinue)

  // Streak popup (after quiz done)
  const btnStreakDone = document.getElementById('btn-streak-done')
  if (btnStreakDone) btnStreakDone.addEventListener('click', () => {
    setState({ quizShowStreak: false, quizShowResults: true, quizCoinsEarned: (s.exam?.questions?.length||3)*2 })
  })

  // Results
  const btnResultsDone = document.getElementById('btn-results-done')
  if (btnResultsDone) btnResultsDone.addEventListener('click', () => {
    resetQuizState()
    setState({ screen: 'current_chapter' })
  })

  // Trial used dismiss
  const btnDismissTrial = document.getElementById('btn-dismiss-trial')
  if (btnDismissTrial) btnDismissTrial.addEventListener('click', () => setState({ trialUsedVisible: false, activeTab: 'chapters', screen: 'chapters', chapter: null, exam: null }))

  // Quiz streak/coins modals overlay close
  const closeQuizStreak = document.getElementById('closeQuizStreakModal')
  if (closeQuizStreak) closeQuizStreak.addEventListener('click', () => setState({ quizShowStreakModal: false }))
  const closeQuizCoins = document.getElementById('closeQuizCoinsModal')
  if (closeQuizCoins) closeQuizCoins.addEventListener('click', () => setState({ quizShowCoinsModal: false }))
}

// ── BOOT ─────────────────────────────────────────────────────────────────
init()
</script>
</body>
</html>
