<html lang="en">

  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="description" content="Help your child with school while you relax."/>
  <title>Numio</title>

  <noscript><img height="1" width="1" style="display:none"
  src="https://www.facebook.com/tr?id=1028944262871292&ev=PageView&noscript=1"/></noscript>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'"/>
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/></noscript>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple: #4F20E8;
      --purple-dark: #3910C5;
      --ink: #0D0D0D;
      --muted: #555;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff;
      color: var(--ink);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
    }

    .card {
      background: #fff;
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 40px 24px 44px;
    }

    /* RED TOP BANNER */
    .top-banner {
      background: #FF4649;
      color: #fff;
      font-size: 17px;
      font-weight: 900;
      text-align: center;
      padding: 16px 20px;
      letter-spacing: 0.01em;
      line-height: 1.3;
      text-transform: uppercase;
      margin: -40px -24px 28px -24px;
    }

    h1 {
      font-size: 32px;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.03em;
      color: var(--ink);
      text-align: center;
      margin-bottom: 6px;
    }

    h1 .red { color: #FF4649; }

    .sub {
      font-size: 17px;
      font-weight: 600;
      color: var(--ink);
      text-align: center;
      line-height: 1.4;
      margin-bottom: 20px;
    }

    /* VIDEO */
    .vsl-wrap {
      width: 94%;
      margin: 0 auto 20px;
      position: relative;
    }

    .vsl-border {
      border: 7px solid #BEB1EA;
      border-radius: 24px;
      overflow: hidden;
      width: 100%;
      background: #000;
      position: relative;
    }

    .vsl-border video {
      width: 100%;
      display: block;
      aspect-ratio: 9/16;
      max-height: 52vh;
      object-fit: cover;
    }

    /* NEW APP badge — top left */
    .vsl-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: rgba(255,255,255,0.22);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 9px;
      border-radius: 6px;
      pointer-events: none;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      border: 1px solid rgba(255,255,255,0.35);
    }

    /* Duration badge — bottom right */
    .vsl-duration {
      position: absolute;
      bottom: 16px;
      right: 10px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      font-size: 13px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 6px;
      pointer-events: none;
      letter-spacing: 0.02em;
    }

    .vsl-timeline {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.25);
    }

    .vsl-timeline-fill {
      height: 100%;
      width: 0%;
      background: #BEB1EA;
      transition: width 0.5s linear;
    }

    /* CHALLENGE IMAGE */
    .challenge-img {
      width: 80%;
      margin: 0 auto 20px;
      display: block;
    }

    /* CTA */
    .bottom {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .watch-warning {
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      color: #FF4649;
      min-height: 20px;
    }

    /* Yellow gradient button like screenshot */
    .cta-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      width: 100%;
      background: linear-gradient(180deg, #FFE234 0%, #F5C400 100%);
      color: #1a0a00;
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 900;
      border: none;
      border-radius: 100px;
      padding: 22px 16px;
      width: calc(100% + 16px);
      margin-left: -8px;
      margin-right: -8px;
      cursor: pointer;
      letter-spacing: 0.02em;
      text-transform: uppercase;
      text-decoration: none;
      transition: filter 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      box-shadow: 0 4px 0 #C49A00, 0 6px 16px rgba(245,196,0,0.35);
      white-space: nowrap;
    }
    .cta-btn .btn-sub {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      opacity: 0.8;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .cta-btn:hover:not(.locked) { filter: brightness(1.05); }
    .cta-btn:active:not(.locked) { transform: scale(0.98); }
    .cta-btn.locked {
      opacity: 0.45;
      cursor: not-allowed;
      filter: grayscale(0.4);
    }

    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    .trust-row {
      display: flex; align-items: center; justify-content: center;
      gap: 18px; flex-wrap: wrap;
    }
    .trust-item {
      display: flex; align-items: center; gap: 5px;
      font-size: 13px; font-weight: 600; color: #444;
    }
    .check-icon {
      width: 16px; height: 16px; background: #22c55e; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .check-icon::after { content: '✓'; font-size: 10px; color: #fff; font-weight: 800; }
  </style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>
<div class="card">
  <div class="top-banner">Wait! This is the last step before you help your child at school</div>

  <h1>Help your child with school while you relax<br><span class="red">for the next 365 days!</span></h1>
  <p class="sub">Never worry about school again, this new app turns any lesson into practise in 15 seconds 👇</p>

  <div class="vsl-wrap">
    <div class="vsl-border">
      <video id="vsl-video" src="./VSL_fr_compressed.mp4" playsinline controls autoplay muted></video>
      <div class="vsl-badge">New App!</div>
      <div class="vsl-duration" id="vsl-duration">0:00 / 1:08</div>
      <div class="vsl-timeline">
        <div class="vsl-timeline-fill" id="vsl-fill"></div>
      </div>
    </div>
  </div>

  <img class="challenge-img" src="./Défi scolaire 365 jours avec dossier et tests.webp" alt="365 Days Challenge"/>

  <div class="bottom">
    <div class="watch-warning" id="watch-warning"></div>
    <button class="cta-btn locked" id="btn-cta">
      Yes, I want better grades for my child for $1
    </button>
    <div class="trust-row">
      <span class="trust-item"><span class="check-icon"></span> Get instant access</span>
      <span class="trust-item"><span class="check-icon"></span> No risk for 365 days</span>
    </div>
  </div>
</div>

<script>
  const UNLOCK_AT = 45
  let unlocked = false

  const video   = document.getElementById('vsl-video')
  const fill    = document.getElementById('vsl-fill')
  const btn     = document.getElementById('btn-cta')
  const warning = document.getElementById('watch-warning')

  // Unmute on first tap
  function unmuteOnce() {
    video.muted = false
    document.removeEventListener('touchstart', unmuteOnce)
    document.removeEventListener('click', unmuteOnce)
  }
  document.addEventListener('touchstart', unmuteOnce, { once: true })
  document.addEventListener('click', unmuteOnce, { once: true })

  function fmt(s) {
    const m = Math.floor(s / 60)
    const sec = Math.floor(s % 60)
    return m + ':' + String(sec).padStart(2, '0')
  }

  video.addEventListener('timeupdate', () => {
    const duration = video.duration || 68
    fill.style.width = Math.min((video.currentTime / duration) * 100, 100) + '%'
    const badge = document.getElementById('vsl-duration')
    if (badge) badge.textContent = fmt(video.currentTime) + ' / 1:08'

    if (!unlocked && video.currentTime >= UNLOCK_AT) {
      unlocked = true
      btn.classList.remove('locked')
      warning.textContent = ''
      launchConfetti()
    }
  })

  btn.addEventListener('click', () => {
    if (!unlocked) {
      warning.textContent = '👆 Watch the video first!'
      setTimeout(() => { warning.textContent = '' }, 2500)
      video.scrollIntoView({ behavior: 'smooth', block: 'center' })
      if (video.paused) video.play()
      return
    }
    try { fbq('track', 'InitiateCheckout') } catch(e) {}
    window.location.href = 'https://numiomath.app/checkout'
  })

  function launchConfetti() {
    const canvas = document.getElementById('confetti-canvas')
    if (!canvas) return
    const ctx = canvas.getContext('2d')
    canvas.width  = window.innerWidth
    canvas.height = window.innerHeight
    const colors = ['#4F20E8','#BEB1EA','#FFD700','#22c55e','#fff','#FF4649']
    const pieces = Array.from({ length: 80 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * -200,
      w: 8 + Math.random() * 8,
      h: 4 + Math.random() * 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.2,
      vx: (Math.random() - 0.5) * 3,
      vy: 3 + Math.random() * 4,
      alpha: 1,
    }))
    let frame
    const startTime = Date.now()
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height)
      const elapsed = Date.now() - startTime
      const done = pieces.every(p => p.y > canvas.height + 20)
      if (done || elapsed > 3500) { ctx.clearRect(0, 0, canvas.width, canvas.height); cancelAnimationFrame(frame); return }
      pieces.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.rotation += p.rotSpeed
        if (elapsed > 2000) p.alpha = Math.max(0, p.alpha - 0.025)
        ctx.save()
        ctx.globalAlpha = p.alpha
        ctx.translate(p.x, p.y)
        ctx.rotate(p.rotation)
        ctx.fillStyle = p.color
        ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h)
        ctx.restore()
      })
      frame = requestAnimationFrame(draw)
    }
    draw()
  }
</script>
</body>
</html>
