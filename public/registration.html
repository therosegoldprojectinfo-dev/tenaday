  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      color: #0A0A0A;
      overflow-x: hidden;
    }

    .page {
      max-width: 480px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* NAV */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 0;
    }
    .nav-logo {
      height: 36px;
      width: auto;
    }
    .nav-btn {
      background: #45E031;
      color: #000;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 30px;
      padding: 10px 18px;
      cursor: pointer;
      white-space: nowrap;
      transition: filter 0.2s;
    }
    .nav-btn:hover { filter: brightness(1.07); }
    .nav-btn:active { filter: brightness(0.93); }

    /* HERO TEXT */
    .hero-tag {
      font-size: 32px;
      font-weight: 800;
      color: #0A0A0A;
      line-height: 1.2;
      letter-spacing: -0.02em;
      margin-top: 24px;
      margin-bottom: 14px;
    }
    .hero-headline {
      font-size: 36px;
      font-weight: 500;
      color: #0A0A0A;
      line-height: 1.2;
      letter-spacing: -0.01em;
      margin-bottom: 28px;
    }

    /* PHONE VISUAL */
    .phone-visual {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
    }
    .phone-left {
      width: 43%;
      height: auto;
    }
    .phone-arrow {
      width: 13%;
      height: auto;
      position: relative;
      top: 10px;
      flex-shrink: 0;
    }
    .phone-right {
      width: 40%;
      height: auto;
    }

    /* CTA BUTTON */
    .cta-btn {
      display: block;
      width: 100%;
      background: #45E031;
      color: #000;
      font-family: 'Inter', sans-serif;
      font-size: 18px;
      font-weight: 700;
      border: none;
      border-radius: 30px;
      padding: 18px 20px;
      cursor: pointer;
      letter-spacing: -0.01em;
      transition: filter 0.2s;
      text-align: center;
    }
    .cta-btn:hover { filter: brightness(1.07); }
    .cta-btn:active { filter: brightness(0.93); }
  </style>
</head>
<body>

  <div class="page">

    <!-- NAV -->
    <nav class="nav">
      <img class="nav-logo" src="/logotousebro.webp" alt="Numio"/>
      <button class="nav-btn" onclick="document.querySelector('.cta-btn').scrollIntoView({behavior:'smooth'})">See it work live →</button>
    </nav>

    <!-- HERO TAG -->
    <div class="hero-tag">The new app for<br>busy parents</div>

    <!-- HERO HEADLINE -->
    <div class="hero-headline">Turn any lesson<br>into practise<br>with just a picture</div>

    <!-- PHONE VISUAL -->
    <div class="phone-visual">
      <img class="phone-left"  src="/tousebro.webp"       alt="Take a pic of their lesson"/>
      <img class="phone-arrow" src="/tousebro%20(2).webp" alt=""/>
      <img class="phone-right" src="/tousebro%20(1).webp" alt="Get a quiz instantly"/>
    </div>

    <!-- CTA -->
    <button class="cta-btn" onclick="if(typeof fbq!=='undefined')fbq('track','Lead'); window.location.href='https://buy.stripe.com/4gM7sL5Idgbt1nMfY51ZS01'">See it work live →</button>

  </div>

</body>
</html>
