  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      color: #0A0A0A;
      overflow-x: hidden;
    }

    .content-wrap {
      max-width: 480px;
      margin: 0 auto;
    }

    /* ─── Red top banner ─── */
    .top-banner {
      background: #FF3A3A;
      color: #fff;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      padding: 12px 20px;
      letter-spacing: -0.01em;
    }

    /* ─── Page body ─── */
    .page-body {
      padding: 28px 24px 0;
      text-align: center;
    }

    .page-title {
      font-size: 32px;
      font-weight: 900;
      color: #0A0A0A;
      line-height: 1.13;
      letter-spacing: -0.03em;
      margin-bottom: 14px;
    }

    .page-sub {
      font-size: 16px;
      font-weight: 400;
      color: #3a3a3a;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    /* ─── Video card ─── */
    .video-wrap {
      width: 100%;
      padding: 0 24px;
      margin-bottom: 24px;
    }
    .video-inner {
      position: relative;
      width: 100%;
      padding-bottom: 140%; /* portrait ratio matching mockup */
      border-radius: 24px;
      overflow: hidden;
      background: #D9D9D9;
      border: 5px solid #03B30F;
    }
    .video-inner iframe,
    .video-inner video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
    }
    .play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .play-overlay svg { opacity: 0.25; }

    /* ─── CTA section ─── */
    .cta-section {
      padding: 0 24px 48px;
      text-align: center;
    }

    .green-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      background: #20DD16;
      color: #000;
      font-family: 'Inter', sans-serif;
      font-size: 18px;
      font-weight: 800;
      border: none;
      border-radius: 33px;
      padding: 20px 24px;
      cursor: pointer;
      letter-spacing: -0.01em;
      text-decoration: none;
      margin-bottom: 14px;
      transition: filter 0.15s, transform 0.1s;
    }
    .green-btn:hover  { filter: brightness(1.06); }
    .green-btn:active { transform: scale(0.98); }

    /* ─── Bullet trust signals ─── */
    .trust-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    .trust-list li {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      font-size: 15px;
      font-weight: 500;
      color: #444;
      margin-bottom: 6px;
    }
    .trust-list li::before {
      content: "•";
      font-size: 18px;
      line-height: 1;
      color: #444;
    }
  </style>
</head>
