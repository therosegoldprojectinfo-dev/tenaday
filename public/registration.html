  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      color: #0A0A0A;
      overflow-x: hidden;
      max-width: 480px;
      margin: 0 auto;
    }

    /*
      NAV
      Figma: page 401px, nav items at x~24px from edge
      Logo: "numio" wordmark — height ~36px in Figma
      Button: 128×17 text inside pill, padding ~10px 20px
      Corner radius: 30px on button
    */
    .nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 24px 28px 32px;
    }
    .nav-logo {
      height: 38px;
      width: auto;
    }
    /* Figma button: 128×38px pill, SemiBold 14px, green #45E031 */
    .nav-btn {
      background: #45E031;
      color: #000;
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 600;
      border: none;
      border-radius: 50px;
      padding: 10px 20px;
      cursor: pointer;
      white-space: nowrap;
      letter-spacing: -0.01em;
    }

    /*
      HERO TEXT
      Figma: text starts at x~24px from left edge
      "The new app for busy parents" — ExtraBold 32px
      "Turn any lesson..." — Medium 36px
      Gap between the two: ~16px
    */
    .hero-text {
      padding: 0 28px;
      margin-top: 16px;
    }
    .hero-tag {
      font-size: 32px;
      font-weight: 800;
      color: #0A0A0A;
      line-height: 1.18;
      letter-spacing: -0.02em;
      margin-bottom: 28px;
    }
    .hero-headline {
      font-size: 36px;
      font-weight: 500;
      color: #0A0A0A;
      line-height: 1.22;
      letter-spacing: -0.01em;
      margin-bottom: 64px;
    }

    /*
      PHONE VISUAL
      Figma page = 401px wide
      Left phone:  119px wide = 29.7% of 401
      Arrow:        87px wide = 21.7% of 401
      Right phone: 117px wide = 29.2% of 401
      Total used:  323px, rest is whitespace ~39px left padding shown in Figma

      Both phones ~224-227px tall = same height
      Left phone bottom-aligned with right phone
      Arrow sits at vertical midpoint between them

      Scale to real screen: use vw units capped at 480px
      On a 390px phone:
        left  = 119/401 * 390 = ~115px
        arrow =  87/401 * 390 =  ~85px
        right = 117/401 * 390 = ~114px
    */
    .phone-visual {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      margin-bottom: 36px;
      gap: 0;
    }
    .phone-left {
      width: 34%;
      height: auto;
      flex-shrink: 0;
      transform: rotate(-8deg);
      transform-origin: bottom center;
    }
    .phone-arrow {
      width: 11%;
      height: auto;
      flex-shrink: 0;
      position: relative;
      top: 10px;
    }
    .phone-right {
      width: 31%;
      height: auto;
      flex-shrink: 0;
      transform: rotate(6deg);
      transform-origin: bottom center;
    }

    /*
      CTA BUTTON
      Figma: 347×60px pill, corner radius 30, fill #45E031
      Bold 18px text
      347/401 = 86.5% of page width → with 28px padding each side that's ~(401-56)=345px ✓
    */
    .cta-wrap {
      padding: 0 28px;
    }
    .cta-btn {
      display: block;
      width: 100%;
      background: #45E031;
      color: #000;
      font-family: 'Inter', sans-serif;
      font-size: 18px;
      font-weight: 700;
      border: none;
      border-radius: 30px;
      padding: 19px 20px;
      cursor: pointer;
      letter-spacing: -0.01em;
      text-align: center;
    }

    /*
      HOW IT WORKS
      Figma (401px frame): text boxes 358px wide, cards 317×243, radius 23, fill #9271FF
      Gaps: h1→sub ~69px, sub→h2 ~76px, h2→card ~77px, card→card ~54px
    */
    .how {
      padding: 56px 0 72px;
      text-align: center;
    }
    .how-h1 {
      font-size: 32px;
      font-weight: 800;
      line-height: 1.19;
      letter-spacing: -0.02em;
      padding: 0 22px;
      margin-bottom: 64px;
    }
    .how-sub {
      font-size: 24px;
      font-weight: 400;
      line-height: 1.2;
      padding: 0 22px;
      margin-bottom: 76px;
    }
    .how-h2 {
      font-size: 32px;
      font-weight: 800;
      line-height: 1.22;
      letter-spacing: -0.02em;
      padding: 0 22px;
      margin-bottom: 76px;
    }
    .step-card {
      width: 79%;                  /* 317 / 401 */
      aspect-ratio: 317 / 243;
      margin: 0 auto 54px;
      border-radius: 23px;
      overflow: hidden;
      background: #9271FF;
      display: flex;
      flex-direction: column;
    }
    .step-card:last-child { margin-bottom: 0; }
    .step-card img {
      width: 100%;
      flex: 171 1 0;               /* image area */
      min-height: 0;
      object-fit: cover;
      object-position: center 55%;
      display: block;
    }
    .step-label {
      flex: 72 1 0;                /* purple label area */
      display: flex;
      align-items: center;
      padding: 0 20px;
      color: #fff;
      font-size: clamp(15px, 4.6vw, 18px);
      font-weight: 700;
      text-align: left;
      letter-spacing: -0.01em;
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav class="nav">
    <img class="nav-logo" src="/logotousebro.webp" alt="Numio"/>
    <button class="nav-btn">See it work live →</button>
  </nav>

  <!-- HERO TEXT -->
  <div class="hero-text">
    <div class="hero-tag">The new app for<br>busy parents</div>
    <div class="hero-headline">Turn any lesson<br>into practise<br>with just a picture</div>
  </div>

  <!-- PHONE VISUAL -->
  <div class="phone-visual">
    <img class="phone-left"  src="/phonestouse.png"        alt="Take a pic of their lesson"/>
    <img class="phone-arrow" src="/tousebro%20(2).webp"   alt=""/>
    <img class="phone-right" src="/phonestouse%20(1).png" alt="Get a quiz instantly"/>
  </div>

  <!-- CTA -->
  <div class="cta-wrap">
    <button class="cta-btn" onclick="if(typeof fbq!=='undefined')fbq('track','Lead'); window.location.href='https://buy.stripe.com/4gM7sL5Idgbt1nMfY51ZS01'">See it work live →</button>
  </div>

  <!-- HOW IT WORKS -->
  <section class="how">
    <h2 class="how-h1">Want more practise<br>for your child?</h2>
    <p class="how-sub">... but you don't want to create the questions yourself?</p>
    <h3 class="how-h2">Here's our simple<br>solution:</h3>

    <div class="step-card">
      <img src="/takepicimage.png" alt="Take a pic of any lesson" loading="lazy"/>
      <div class="step-label">#1 Take a pic of any lesson</div>
    </div>
    <div class="step-card">
      <img src="/wait15secimage.png" alt="Wait 15 seconds" loading="lazy"/>
      <div class="step-label">#2 Wait 15 seconds</div>
    </div>
    <div class="step-card">
      <img src="/practiseimage.png" alt="Your child can practise" loading="lazy"/>
      <div class="step-label">#3 Your child can practise!</div>
    </div>
  </section>

</body>
</html>
