  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --purple: #4F20E8;
      --purple-dark: #3910C5;
      --ink: #0D0D0D;
      --muted: #555;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff;
      color: var(--ink);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
    }

    .card {
      background: #fff;
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 40px 24px 44px;
    }

    h1 {
      font-size: 36px;
      font-weight: 900;
      line-height: 1.15;
      letter-spacing: -0.03em;
      color: var(--ink);
      text-align: center;
      margin-bottom: 14px;
    }

    .sub {
      font-size: 18px;
      font-weight: 600;
      color: var(--ink);
      text-align: center;
      line-height: 1.4;
      margin-bottom: 28px;
    }

    /* Video */
    .vsl-wrap {
      width: 75%;
      margin: 0 auto 32px;
      position: relative;
    }

    .vsl-border {
      border: 7px solid #BEB1EA;
      border-radius: 24px;
      overflow: hidden;
      width: 100%;
      background: #000;
    }

    .vsl-border video {
      width: 100%;
      display: block;
      aspect-ratio: 9/16;
      max-height: 55vh;
      object-fit: cover;
    }

    .vsl-timeline {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.25);
    }

    .vsl-timeline-fill {
      height: 100%;
      width: 0%;
      background: #BEB1EA;
      transition: width 0.5s linear;
    }

    /* CTA */
    .bottom {
      margin-top: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cta-btn {
      display: flex; align-items: center; justify-content: center;
      width: 100%; background: var(--purple); color: #fff;
      font-family: 'Inter', sans-serif; font-size: 17px; font-weight: 800;
      border: none; border-radius: 100px; padding: 20px 24px;
      cursor: pointer; letter-spacing: -0.01em; text-decoration: none;
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .cta-btn:hover:not(.locked) { background: var(--purple-dark); }
    .cta-btn:active:not(.locked) { transform: scale(0.98); }
    .cta-btn.locked {
      opacity: 0.45;
      cursor: not-allowed;
      filter: grayscale(0.3);
    }

    .watch-warning {
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      color: #E8232A;
      min-height: 20px;
      transition: opacity 0.2s;
    }

    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    .trust-row {
      display: flex; align-items: center; justify-content: center;
      gap: 18px; flex-wrap: wrap;
    }
    .trust-item {
      display: flex; align-items: center; gap: 5px;
      font-size: 13px; font-weight: 600; color: #444;
    }
    .check-icon {
      width: 16px; height: 16px; background: #22c55e; border-radius: 50%;
      display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .check-icon::after { content: '✓'; font-size: 10px; color: #fff; font-weight: 800; }
  </style>
</head>
<body>
<div class="card">
  <h1>Help your child with school while you relax.</h1>
  <p class="sub">This new app turns any lesson into practise in 15 seconds 👇</p>

  <div class="vsl-wrap">
    <div class="vsl-border">
      <video id="vsl-video" src="./VSL_fr_compressed.mp4" playsinline controls autoplay muted></video>
      <div class="vsl-timeline">
        <div class="vsl-timeline-fill" id="vsl-fill"></div>
      </div>
    </div>
  </div>

  <canvas id="confetti-canvas"></canvas>
  <div class="bottom">
    <div class="watch-warning" id="watch-warning"></div>
    <button class="cta-btn locked" id="btn-cta">Get unlimited access for $1 →</button>
    <div class="trust-row">
      <span class="trust-item"><span class="check-icon"></span> Get instant access</span>
      <span class="trust-item"><span class="check-icon"></span> No risk for 365 days</span>
    </div>
  </div>
</div>

<script>
  const UNLOCK_AT = 45 // seconds
  let unlocked = false

  const video   = document.getElementById('vsl-video')
  const fill    = document.getElementById('vsl-fill')
  const btn     = document.getElementById('btn-cta')
  const warning = document.getElementById('watch-warning')

  // Timeline progress
  video.addEventListener('timeupdate', () => {
    const duration = video.duration || 88
    fill.style.width = Math.min((video.currentTime / duration) * 100, 100) + '%'

    // Unlock at 45s
    if (!unlocked && video.currentTime >= UNLOCK_AT) {
      unlocked = true
      btn.classList.remove('locked')
      warning.textContent = ''
      launchConfetti()
    }
  })

  // Block click if locked
  btn.addEventListener('click', (e) => {
    if (!unlocked) {
      e.preventDefault()
      warning.textContent = '👆 Watch the video first!'
      setTimeout(() => { warning.textContent = '' }, 2500)
      // Scroll video into view and make sure it's playing
      video.scrollIntoView({ behavior: 'smooth', block: 'center' })
      if (video.paused) video.play()
      return
    }
    try { fbq('track', 'InitiateCheckout') } catch(e) {}
    window.location.href = 'https://numiomath.app/checkout'
  })

  // Confetti burst
  function launchConfetti() {
    const canvas = document.getElementById('confetti-canvas')
    if (!canvas) return
    const ctx = canvas.getContext('2d')
    canvas.width  = window.innerWidth
    canvas.height = window.innerHeight

    const colors = ['#4F20E8','#BEB1EA','#FFD700','#22c55e','#fff','#E8232A']
    const pieces = Array.from({ length: 80 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * -200,
      w: 8 + Math.random() * 8,
      h: 4 + Math.random() * 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      rotation: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.2,
      vx: (Math.random() - 0.5) * 3,
      vy: 3 + Math.random() * 4,
      alpha: 1,
    }))

    let frame
    const startTime = Date.now()
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height)
      const elapsed = Date.now() - startTime
      const done = pieces.every(p => p.y > canvas.height + 20)
      if (done || elapsed > 3500) { ctx.clearRect(0, 0, canvas.width, canvas.height); cancelAnimationFrame(frame); return }
      pieces.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.rotation += p.rotSpeed
        if (elapsed > 2000) p.alpha = Math.max(0, p.alpha - 0.025)
        ctx.save()
        ctx.globalAlpha = p.alpha
        ctx.translate(p.x, p.y)
        ctx.rotate(p.rotation)
        ctx.fillStyle = p.color
        ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h)
        ctx.restore()
      })
      frame = requestAnimationFrame(draw)
    }
    draw()
  }
</script>
</body>
</html>
