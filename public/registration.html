<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <meta name="description" content="Infinite practise for your child in 15 seconds."/>
  <title>Numio – Get Started</title>

  <!-- Meta Pixel -->
  <script>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    :root {
      --purple: #4F20E8;
      --purple-dark: #3910C5;
      --purple-light: #F0ECFF;
      --ink: #0D0D0D;
      --muted: #888;
      --border: #E0E0E0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff;
      color: var(--ink);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
    }

    .card {
      background: #fff;
      width: 100%;
      max-width: 480px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* BYE screen */
    .bye-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      font-size: 24px;
      font-weight: 900;
      color: var(--ink);
      letter-spacing: -0.03em;
      text-align: center;
      padding: 40px 32px;
      line-height: 1.4;
    }

    /* PROGRESS */
    .progress-wrap { padding: 20px 24px 0; flex-shrink: 0; }
    .progress-steps-label { text-align: center; font-size: 15px; font-weight: 700; color: var(--ink); margin-bottom: 10px; }
    .progress-track { height: 20px; border-radius: 999px; background: #EBEBEB; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 999px; background: var(--purple); transition: width 0.4s cubic-bezier(0.4,0,0.2,1); }

    /* SCREEN */
    .screen { display: flex; flex-direction: column; padding: 28px 24px 16px; }
    .screen.grow { flex: 1; }
    .screen-anim { animation: slideIn 0.28s cubic-bezier(0.4,0,0.2,1); }
    @keyframes slideIn { from { opacity:0; transform:translateX(20px); } to { opacity:1; transform:translateX(0); } }

    /* ── LANDING ── */
    .landing-logo { margin-bottom: 20px; }
    .landing-logo img { height: 34px; width: auto; object-fit: contain; }

    /* More breathing room between logo and phones */
    .landing-body { margin-top: 48px; }

    /* Phone duo */
    .phone-wrap {
      width: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      margin-bottom: 44px;
      gap: 0;
      overflow: visible;
      min-height: 240px;
      position: relative;
    }

    /* Left phone: tilted left, lower */
    .phone-wrap img.phone-left {
      width: 42%;
      max-width: 180px;
      height: auto;
      object-fit: contain;
      transform: rotate(-12deg) translateX(12px) translateY(20px);
      transform-origin: bottom center;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    /* Arrow: pushed higher between the two phones */
    .phone-wrap img.arrow-img {
      width: 10%;
      max-width: 40px;
      height: auto;
      object-fit: contain;
      flex-shrink: 0;
      position: relative;
      z-index: 2;
      margin-bottom: 140px;
    }

    /* Right phone: tilted right, higher than left */
    .phone-wrap img.phone-right {
      width: 42%;
      max-width: 180px;
      height: auto;
      object-fit: contain;
      transform: rotate(8deg) translateX(-12px) translateY(-30px);
      transform-origin: bottom center;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    .landing-title {
      font-size: 30px;
      font-weight: 900;
      color: var(--ink);
      line-height: 1.18;
      letter-spacing: -0.03em;
      margin-bottom: 0;
      text-align: center;
    }

    /* ── QUESTION ── */
    .question-text {
      font-size: 22px;
      font-weight: 800;
      color: var(--ink);
      line-height: 1.32;
      letter-spacing: -0.02em;
      margin-bottom: 28px;
    }

    .options-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .option-btn {
      width: 100%;
      padding: 20px 20px;
      border-radius: 16px;
      border: 1.5px solid var(--border);
      background: #fff;
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      font-weight: 700;
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .option-btn:hover { border-color: #bbb; }
    .option-btn.selected {
      border-color: var(--purple);
      background: var(--purple-light);
      color: var(--purple);
    }

    /* SOLUTION */
    .solution-title { font-size: 21px; font-weight: 800; color: var(--ink); line-height: 1.3; letter-spacing: -0.02em; margin-bottom: 18px; }

    .demo-border {
      border: 7px solid #BEB1EA;
      border-radius: 24px;
      overflow: hidden;
      width: 100%;
      background: #000;
      margin-bottom: 22px;
    }
    .demo-border video {
      width: 100%;
      display: block;
      aspect-ratio: 16/9;
      object-fit: cover;
    }
    .demo-timeline {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.25);
    }
    .demo-timeline-fill {
      height: 100%;
      width: 0%;
      background: #BEB1EA;
      transition: width 0.5s linear;
    }

    .sub-question { font-size: 17px; font-weight: 700; color: var(--ink); margin-bottom: 14px; }

    /* OFFER */
    .offer-banner {
      background: #E8232A;
      color: #fff;
      font-size: 19px;
      font-weight: 900;
      text-align: center;
      padding: 14px 20px;
      letter-spacing: 0.02em;
      line-height: 1.4;
      text-transform: uppercase;
      margin: -28px -24px 20px -24px;
    }
    .offer-title { font-size: 24px; font-weight: 900; color: var(--ink); letter-spacing: -0.03em; margin-bottom: 5px; }
    .offer-sub { font-size: 15px; color: var(--muted); margin-bottom: 18px; font-weight: 500; }

    /* Confetti canvas */
    #confetti-canvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 999;
    }

    .vsl-wrap {
      width: 75%;
      margin: 0 auto;
      position: relative;
    }
    .vsl-border {
      border: 7px solid #BEB1EA;
      border-radius: 24px;
      overflow: hidden;
      width: 100%;
      background: #000;
      position: relative;
    }
    .vsl-border video {
      width: 100%;
      display: block;
      aspect-ratio: 9/16;
      max-height: 55vh;
      object-fit: cover;
    }
    /* Timeline bar sits inside the border at the very bottom */
    .vsl-timeline {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.25);
    }
    .vsl-timeline-fill {
      height: 100%;
      width: 0%;
      background: #BEB1EA;
      transition: width 0.5s linear;
    }

    /* BOTTOM */
    .bottom-area {
      flex-shrink: 0;
      padding: 16px 24px 40px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .cta-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; background: var(--purple); color: #fff;
      font-family: 'Inter', sans-serif; font-size: 17px; font-weight: 800;
      border: none; border-radius: 100px; padding: 20px 24px;
      cursor: pointer; letter-spacing: -0.01em; text-decoration: none;
      transition: background 0.15s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .cta-btn:hover { background: var(--purple-dark); }
    .cta-btn:active { transform: scale(0.98); }
    .cta-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .step-counter { text-align: center; font-size: 14px; font-weight: 600; color: var(--muted); }

    .trust-row { display: flex; align-items: center; justify-content: center; gap: 18px; flex-wrap: wrap; }
    .trust-item { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; color: #444; }
    .check-icon { width: 16px; height: 16px; background: #22c55e; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .check-icon::after { content: '✓'; font-size: 10px; color: #fff; font-weight: 800; }
  </style>
</head>
<body>
<canvas id="confetti-canvas"></canvas>
<div class="card" id="card">
  <div class="progress-wrap" id="progress-wrap" style="display:none;">
    <div class="progress-steps-label" id="progress-steps-label"></div>
    <div class="progress-track"><div class="progress-fill" id="progress-fill" style="width:0%"></div></div>
  </div>
  <div class="screen screen-anim" id="screen-content"></div>
  <div class="bottom-area" id="bottom-area"></div>
</div>

<script>
// ── SUPABASE ──────────────────────────────────────────────────────────────
const SUPABASE_URL  = 'https://lyedpfhzrvyaskmzhyhl.supabase.co'
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx5ZWRwZmh6cnZ5YXNrbXpoeWhsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ3MzA0NDUsImV4cCI6MjEwMDMwNjQ0NX0.RUWNNJ67V-uDJTflaFGjW0xoNnExzZ0_tIvd6VmZ2q0'
const STRIPE_URL    = 'https://buy.stripe.com/fZu14n0nT1gz3vU7rz1ZS03'
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON)

// ── SESSION ───────────────────────────────────────────────────────────────
function getSessionId() {
  let id = sessionStorage.getItem('numio_sid')
  if (!id) {
    id = (typeof crypto !== 'undefined' && crypto.randomUUID)
      ? crypto.randomUUID()
      : Math.random().toString(36).slice(2) + Date.now()
    sessionStorage.setItem('numio_sid', id)
  }
  return id
}
const SESSION_ID = getSessionId()

async function trackStep(step, answer) {
  try { await sb.from('quiz_responses').insert({ session_id: SESSION_ID, step, answer: answer || null }) }
  catch(e) { /* non-blocking */ }
}

// ── BYE CHECK — runs before anything else ────────────────────────────────
// If they ever clicked "No" on any question, they see Bye. forever.
if (sessionStorage.getItem('numio_bye') === '1') {
  document.getElementById('card').innerHTML = '<div class="bye-screen">Sorry but Numio is not for you. Have a good day! 👋</div>'
  // Stop the rest of the script
  throw new Error('bye')
}

// ── FLOW ──────────────────────────────────────────────────────────────────
const TOTAL_Q = 3

const QUESTIONS = [
  { screen:'q1', step:1, stepsLeft:4, text:'What kind of practice does your child need right now?', options:['School lessons revision','Simple daily practise','Test and exam preparation'] },
  { screen:'q2', step:2, stepsLeft:3, text:'What is the biggest problem when your child practices at home?', options:['Not enough practise','Not motivated to practise','Practise don\'t match their schools'] },
  { screen:'q3', step:3, stepsLeft:2, text:'What would save you the most stress right now?', options:['Not buying other books','Not creating questions myself','Both, I want fast and cheap practice'] },
]

// ── STATE ─────────────────────────────────────────────────────────────────
let selectedOption = null
let currentScreen  = 'landing'

function goTo(screen) {
  selectedOption = null
  currentScreen  = screen
  render()
}

function showBye() {
  sessionStorage.setItem('numio_bye', '1')
  document.getElementById('progress-wrap').style.display = 'none'
  document.getElementById('screen-content').innerHTML = '<div class="bye-screen">Sorry but Numio is not for you. Have a good day! 👋</div>'
  document.getElementById('bottom-area').innerHTML = ''
}

// ── RENDER ────────────────────────────────────────────────────────────────
function render() {
  const progressWrap = document.getElementById('progress-wrap')
  const fill         = document.getElementById('progress-fill')
  const content      = document.getElementById('screen-content')
  const bottom       = document.getElementById('bottom-area')

  content.classList.remove('screen-anim')
  void content.offsetWidth
  content.classList.add('screen-anim')

  if (currentScreen === 'landing') {
    progressWrap.style.display = 'none'
    content.innerHTML = htmlLanding()
    bottom.innerHTML  = htmlLandingBottom()

  } else if (['q1','q2','q3'].includes(currentScreen)) {
    const q = QUESTIONS.find(x => x.screen === currentScreen)
    const pct = (q.step / (TOTAL_Q + 2)) * 100
    progressWrap.style.display = 'block'
    document.getElementById('progress-steps-label').textContent = q.stepsLeft + ' steps left'
    fill.style.width = pct + '%'
    content.innerHTML = htmlQuestion(q)
    bottom.innerHTML  = ''

  } else if (currentScreen === 'solution') {
    progressWrap.style.display = 'block'
    document.getElementById('progress-steps-label').textContent = '1 step left'
    fill.style.width = ((TOTAL_Q + 1) / (TOTAL_Q + 2) * 100) + '%'
    content.innerHTML = htmlSolution()
    bottom.innerHTML  = htmlSolutionBottom()

  } else if (currentScreen === 'offer') {
    progressWrap.style.display = 'none'
    content.innerHTML = htmlOffer()
    bottom.innerHTML  = htmlOfferBottom()
    setTimeout(launchConfetti, 100)
  }

  attachListeners()
}

// ── HTML TEMPLATES ────────────────────────────────────────────────────────

function htmlLanding() {
  return `
    <div class="landing-logo">
      <img src="./logotousebro.webp" alt="Numio"/>
    </div>
    <div class="landing-body">
      <div class="phone-wrap">
        <img class="phone-left" src="./phonestouse.png" alt="Camera"/>
        <img class="arrow-img" src="./arrowpicturetouse.png" alt=""/>
        <img class="phone-right" src="./phonestouse (1).png" alt="App"/>
      </div>
      <h1 class="landing-title">Infinite practise for<br>your child in 15 seconds</h1>
    </div>
  `
}

function htmlLandingBottom() {
  return `
    <button class="cta-btn" id="btn-start">Get started →</button>
    <p class="step-counter">Less than 2 minutes to complete</p>
  `
}

function htmlQuestion(q) {
  return `
    <p class="question-text">${q.text}</p>
    <div class="options-list">
      ${q.options.map(opt => `
        <button class="option-btn${selectedOption === opt ? ' selected' : ''}" data-opt="${encodeURIComponent(opt)}">
          ${opt}
        </button>
      `).join('')}
    </div>
  `
}

function htmlQuestionBottom(stepsLeft) {
  const disabled = selectedOption === null ? 'disabled' : ''
  return `
    <button class="cta-btn" id="btn-continue" ${disabled}>Continue →</button>
    <p class="step-counter">${stepsLeft} step${stepsLeft !== 1 ? 's' : ''} left</p>
  `
}

function htmlSolution() {
  return `
    <h2 class="solution-title">Great, so here's an easier and faster solution:</h2>
    <div class="demo-border">
      <video id="demo-video" src="./Demo.mp4" playsinline controls autoplay></video>
      <div class="demo-timeline">
        <div class="demo-timeline-fill" id="demo-fill"></div>
      </div>
    </div>
    <p class="sub-question">Do you think this could help you?</p>
    <div class="options-list">
      ${['Yes, that would help!','No, thanks.'].map(opt => `
        <button class="option-btn${selectedOption === opt ? ' selected' : ''}" data-opt="${encodeURIComponent(opt)}">
          ${opt}
        </button>
      `).join('')}
    </div>
  `
}

function htmlSolutionBottom() {
  return ''
}

function htmlOffer() {
  return `
    <div class="offer-banner">⚠️ Don't leave without watching this video 👇</div>
    <h2 class="offer-title">Your offer is ready!</h2>
    <p class="offer-sub">Watch this video to decide:</p>
    <div class="vsl-wrap">
      <div class="vsl-border">
        <video id="vsl-video" src="./VSL_compressed.mp4" playsinline controls autoplay></video>
        <div class="vsl-timeline">
          <div class="vsl-timeline-fill" id="vsl-fill"></div>
        </div>
      </div>
    </div>
  `
}

function htmlOfferBottom() {
  return `
    <a class="cta-btn" href="${STRIPE_URL}" id="btn-stripe">Get started →</a>
    <div class="trust-row">
      <span class="trust-item"><span class="check-icon"></span> Get instant access</span>
      <span class="trust-item"><span class="check-icon"></span> No risk for 365 days</span>
    </div>
  `
}

// ── LISTENERS ─────────────────────────────────────────────────────────────
function attachListeners() {

  const btnStart = document.getElementById('btn-start')
  if (btnStart) {
    btnStart.addEventListener('click', async () => {
      await trackStep(0, 'landing_started')
      goTo('q1')
    })
  }

  document.querySelectorAll('.option-btn').forEach(btn => {
    btn.addEventListener('click', async () => {
      const opt = decodeURIComponent(btn.dataset.opt)
      selectedOption = opt

      // Flash selected state briefly before navigating
      document.querySelectorAll('.option-btn').forEach(b => {
        b.classList.toggle('selected', decodeURIComponent(b.dataset.opt) === opt)
      })

      // Small delay so user sees the selection before moving on
      await new Promise(r => setTimeout(r, 180))

      if (currentScreen === 'solution') {
        await trackStep(5, opt)
        goTo('offer')
        return
      }

      const q = QUESTIONS.find(x => x.screen === currentScreen)
      if (q) await trackStep(q.step, opt)

      const nextMap = { q1:'q2', q2:'q3', q3:'solution' }
      if (nextMap[currentScreen]) goTo(nextMap[currentScreen])
    })
  })

  // Continue button still used on solution screen
  const btnContinue = document.getElementById('btn-continue')
  if (btnContinue) {
    btnContinue.addEventListener('click', async () => {
      if (!selectedOption) return
      await trackStep(5, selectedOption)
      goTo('offer')
    })
  }

  const demoVideo = document.getElementById('demo-video')
  if (demoVideo) {
    demoVideo.addEventListener('timeupdate', () => {
      const fill = document.getElementById('demo-fill')
      if (!fill) return
      const duration = demoVideo.duration || 15
      const pct = Math.min((demoVideo.currentTime / duration) * 100, 100)
      fill.style.width = pct + '%'
    })
  }

  const vslVideo = document.getElementById('vsl-video')
  if (vslVideo) {
    vslVideo.addEventListener('timeupdate', () => {
      const fill = document.getElementById('vsl-fill')
      if (!fill) return
      const duration = vslVideo.duration || 88
      const pct = Math.min((vslVideo.currentTime / duration) * 100, 100)
      fill.style.width = pct + '%'
    })
  }

  const btnStripe = document.getElementById('btn-stripe')
  if (btnStripe) {
    btnStripe.addEventListener('click', () => {
      try { fbq('track', 'InitiateCheckout') } catch(e) {}
      trackStep(6, 'stripe_clicked')
    })
  }
}

// ── CONFETTI ──────────────────────────────────────────────────────────────
function launchConfetti() {
  const canvas = document.getElementById('confetti-canvas')
  if (!canvas) return
  const ctx = canvas.getContext('2d')
  canvas.width  = window.innerWidth
  canvas.height = window.innerHeight

  const colors = ['#4F20E8','#BEB1EA','#E8232A','#FFD700','#22c55e','#fff']
  const pieces = Array.from({ length: 120 }, () => ({
    x: Math.random() * canvas.width,
    y: Math.random() * -canvas.height,
    w: 8 + Math.random() * 8,
    h: 4 + Math.random() * 4,
    color: colors[Math.floor(Math.random() * colors.length)],
    rotation: Math.random() * Math.PI * 2,
    rotSpeed: (Math.random() - 0.5) * 0.2,
    vx: (Math.random() - 0.5) * 3,
    vy: 3 + Math.random() * 4,
    alpha: 1,
  }))

  let frame
  const startTime = Date.now()

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height)
    const elapsed = Date.now() - startTime
    const done = pieces.every(p => p.y > canvas.height + 20)

    if (done || elapsed > 4000) {
      ctx.clearRect(0, 0, canvas.width, canvas.height)
      cancelAnimationFrame(frame)
      return
    }

    pieces.forEach(p => {
      p.x += p.vx
      p.y += p.vy
      p.rotation += p.rotSpeed
      if (elapsed > 2500) p.alpha = Math.max(0, p.alpha - 0.02)

      ctx.save()
      ctx.globalAlpha = p.alpha
      ctx.translate(p.x, p.y)
      ctx.rotate(p.rotation)
      ctx.fillStyle = p.color
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h)
      ctx.restore()
    })

    frame = requestAnimationFrame(draw)
  }
  draw()
}

// ── BOOT ──────────────────────────────────────────────────────────────────
render()
</script>
</body>
</html>
