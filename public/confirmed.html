<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Numio — Confirm your spot!</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;700;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --green:      #58cc02;
      --green-dark: #46a302;
      --ink:        #1a1a2e;
      --muted:      #777;
      --bg:         #ffffff;
      --card:       #f7f9f4;
      --border:     #e8f0e0;
      --wa:         #25D366;
      --wa-dark:    #1da851;
    }
    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--ink);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 440px;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 24px;
      padding: 36px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      text-align: center;
    }

    .emoji { font-size: 60px; }

    .headline {
      font-family: 'Baloo 2', sans-serif;
      font-weight: 900;
      font-size: 26px;
      color: var(--ink);
      line-height: 1.2;
    }

    .sub {
      font-size: 15px;
      color: var(--muted);
      line-height: 1.6;
    }

    .slot-pill {
      background: white;
      border: 2px solid var(--border);
      border-radius: 100px;
      padding: 10px 20px;
      font-family: 'Baloo 2', sans-serif;
      font-weight: 800;
      font-size: 15px;
      color: var(--ink);
    }

    .wa-btn {
      width: 100%;
      background: var(--wa);
      color: white;
      border: none;
      border-radius: 16px;
      padding: 17px;
      font-family: 'Baloo 2', sans-serif;
      font-weight: 800;
      font-size: 17px;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--wa-dark);
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      text-decoration: none;
      margin-top: 8px;
    }
    .wa-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--wa-dark); }

    .note {
      font-size: 12px;
      color: #bbb;
      line-height: 1.5;
    }

    .footer { margin-top: 24px; font-size: 12px; color: #ccc; }
  </style>

  <!-- Meta Pixel Code -->
  <script>
  !function(f,b,e,v,n,t,s)
  {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
  n.callMethod.apply(n,arguments):n.queue.push(arguments)};
  if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
  n.queue=[];t=b.createElement(e);t.async=!0;
  t.src=v;s=b.getElementsByTagName(e)[0];
  s.parentNode.insertBefore(t,s)}(window, document,'script',
  'https://connect.facebook.net/en_US/fbevents.js');
  fbq('init', '1028944262871292');
  fbq('track', 'PageView');
  </script>
  <noscript><img height="1" width="1" style="display:none"
  src="https://www.facebook.com/tr?id=1028944262871292&ev=PageView&noscript=1"
  /></noscript>
</head>
<body>

  <div class="card">
    <div class="emoji">🎉</div>
    <div class="headline" id="headline">Almost there!</div>
    <div class="sub">One last thing — tap below to confirm your spot on WhatsApp 👇</div>
    <div class="slot-pill" id="slotPill">Friday, August 7th · Riyadh Time</div>
    <a class="wa-btn" id="waBtn" href="#" target="_blank">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413Z"/></svg>
      ✅ Confirm your spot on WhatsApp
    </a>
    <div class="note">📚 Make sure your child's textbook is nearby</div>
  </div>

  <div class="footer">© 2026 Numio · numiomath.app</div>

  <script>
    const params = new URLSearchParams(window.location.search)
    const name = params.get('name') || ''
    const slot = params.get('slot') || ''
    const phone = params.get('phone') || ''
    const firstName = name.split(' ')[0]

    // Update UI
    if (firstName) {
      document.getElementById('headline').textContent = `Almost there, ${firstName}! 🙌`
    }
    if (slot) {
      document.getElementById('slotPill').textContent = `Friday, August 7th · ${slot} Riyadh Time`
    }

    // Build WhatsApp link
    const msg = encodeURIComponent(
      `Hello Numio, I am ${name} and I confirm my spot for the Numio event at Aug 7 - ${slot} Riyadh Time. I guarantee we'll be there 😊`
    )
    document.getElementById('waBtn').href = `https://wa.me/14384099964?text=${msg}`

    // Fire CompleteRegistration pixel event
    if (window.fbq) {
      fbq('track', 'CompleteRegistration', {
        content_name: 'Numio WhatsApp Confirm',
        content_category: slot
      })
    }
  </script>

</body>
</html>
