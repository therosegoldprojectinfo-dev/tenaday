  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #fff;
      color: #0A0A0A;
      font-size: 16px;
      line-height: 1.6;
    }

    .inner {
      max-width: 480px;
      margin: 0 auto;
    }



    /* ── HERO SECTION ── */
    .hero-section {
      padding: 40px 20px 0;
      text-align: center;
    }

    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 22px;
      font-weight: 800;
      color: #0A0A0A;
      letter-spacing: 0.01em;
      margin-bottom: 20px;
      text-transform: uppercase;
    }

    .hero-headline {
      font-size: 29px;
      font-weight: 800;
      color: #0A0A0A;
      line-height: 1.25;
      letter-spacing: -0.01em;
      margin-bottom: 28px;
    }

    .how-label {
      font-size: 29px;
      font-weight: 600;
      color: #0A0A0A;
      line-height: 1.3;
      margin-bottom: 28px;
    }

    /* ── VIDEO PLACEHOLDER ── */
    .video-placeholder {
      width: 100%;
      background: #E8E8E8;
      border-radius: 18px;
      aspect-ratio: 16 / 9;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
    }
    .video-placeholder .play-icon {
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 18px 0 18px 32px;
      border-color: transparent transparent transparent #888;
      margin-left: 6px;
    }

    /* ── STEP PLACEHOLDERS ── */
    .steps-stack {
      display: flex;
      flex-direction: column;
      gap: 16px;
      padding-bottom: 48px;
    }

    .step-card {
      width: 100%;
      background: #E8E8E8;
      border-radius: 18px;
      aspect-ratio: 4 / 3;
      display: flex;
      align-items: flex-end;
      padding: 16px 20px;
      position: relative;
    }

    .step-card .step-num-label {
      font-size: 20px;
      font-weight: 700;
      color: #0A0A0A;
      line-height: 1.3;
    }

  </style>

        <div class="step-card">
